name: Website Verifier v0.4

on:
  pull_request:
    branches:
      - website/paygod-production
    paths:
      - 'website/**'
      - '.github/workflows/website-verifier-v0.3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Website Verifier v0.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned issuer-auth backend
        run: python -m pip install -r website/vendor/requirements-issuer-auth.txt

      - name: Build website and regenerate signed fixture
        working-directory: website
        run: python3 build.py

      - name: Bilingual evidence atlas static checks
        working-directory: website
        run: python3 tests/atlas.py

      - name: Arabic and English homepage language-switch audit
        working-directory: website
        run: python3 tests/home_language.py

      - name: V2 bilingual preview route and interactive-slide audit
        working-directory: website
        run: python3 tests/v2.py

      - name: EIK bilingual developer entry and bounded claims
        working-directory: website
        run: python3 tests/eik_developers.py

      - name: Bilingual Evidence Lab route, module provenance and SEO
        working-directory: website
        run: python3 tests/evidence_lab.py

      - name: Evidence Lab clean and tampered v0.4 integrity witness
        working-directory: website
        run: node tests/evidence_lab.mjs

      - name: Evidence Lab browser module syntax
        working-directory: website
        run: node --check v2/lab.js

      - name: V2 UI script syntax (interaction and Evidence Lens)
        working-directory: website
        run: |
          node --check v2/interactions.js
          node --check v2/lens.js

      - name: Kernel use-case editorial and route audit
        working-directory: website
        run: python3 tests/use_cases.py

      - name: Kernel verified-claims alignment across all editorial routes
        working-directory: website
        run: python3 tests/claims_alignment.py

      - name: Browser verifier v0.4 regression suite
        working-directory: website
        run: node tests/verify.mjs

      - name: Standalone Python verifier v0.4 suite
        working-directory: website
        run: python3 tests/upstream.py

      - name: Assert built verifier contract
        shell: bash
        run: |
          grep -q "BROWSER VERIFIER v0.4" website/dist/verifier/index.html
          grep -q "verifier v0.4" website/dist/verifier/index.html
          grep -q "EXPECTED RECEIPT SHA-256" website/dist/verifier/index.html
          grep -q "TRUSTED ISSUER KEYS" website/dist/verifier/index.html
          grep -q "paygod-c14n-v1" website/dist/verifier/index.html
          grep -q "paygod-ed25519-receipt-v1" website/dist/verifier/index.html
          grep -q "Issuer authenticity" website/dist/verifier/index.html
          test -f website/dist/downloads/paygod-demo-trust-store.json
          python - <<'PY'
          import json
          from pathlib import Path
          trust=json.loads(Path('website/dist/downloads/paygod-demo-trust-store.json').read_text())
          assert trust['profile']=='paygod-ed25519-trust-v1'
          assert trust['keys'][0]['key_id']=='paygod-demo-issuer-2026-10-03'
          PY
          if grep -q "browser-demo/0.1" website/dist/verifier/index.html; then
            echo "legacy browser-demo profile leaked into build"
            exit 1
          fi
          if grep -q "canonicalization.json==='rfc8785'" website/dist/verifier/index.html; then
            echo "legacy rfc8785 claim leaked into build"
            exit 1
          fi

      - name: Production-home cutover rehearsal (SEO, bilingual routes, archive)
        working-directory: website
        env:
          VERCEL_ENV: production
        run: |
          python3 build.py
          python3 tests/v2.py
          python3 tests/home_language.py
          python3 tests/use_cases.py
          python3 tests/claims_alignment.py
          python3 tests/eik_developers.py
          python3 tests/evidence_lab.py

      - name: Publish built preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: paygod-website-verifier-v0.4
          path: website/dist
          retention-days: 30
